[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Turn long-form video into captioned vertical clips with ready-to-post copy."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0",
    "faster-whisper>=1.1",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "pillow>=10",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["fonts/*", "models/*", "*.html"]
